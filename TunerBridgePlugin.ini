
; TunerBridgePlugin.ini
; TVTest 側 TunerBridgePlugin.tvtp 用設定ファイル
;
; DLL生成名:
;   TunerBridgePlugin.dll
;
; TVTest配置名:
;   TunerBridgePlugin.tvtp
;
; 設定ファイル名:
;   TunerBridgePlugin.ini
;
; {TUNER} は TVTest 起動時の /DID から決定します。
;
;   /DID A または /DID 0 => 0
;   /DID B または /DID 1 => 1
;   /DID C または /DID 2 => 2
;
; アプリ側 config.ini の例:
;   Tuner0 => \\.\pipe\TVTestBridge_0
;   Tuner1 => \\.\pipe\TVTestBridge_1
;
; と一致させるため、ここでは TVTestBridge_{TUNER} を使います。

[Settings]

; プラグイン機能を有効化
Enabled=1

; デバッグログ出力
; 動作確認中は 1、安定後は 0 推奨
VerboseLog=1

; TVTest起動直後からTS転送を有効化するか
; 通常はアプリ側から ENABLE_TS を送るため 0
AutoEnableTs=0

; 制御パイプ接続時に状態を返す
SendStatusOnConnect=1

; 旧方式の _A / _B suffix は使わない
; {TUNER} 方式を使うため 0
UseDidSuffix=0

; 旧suffix方式を使う場合の互換設定
; 今回は UseDidSuffix=0 なので通常は未使用
PipeSuffixMode=number

; SET_CHANNEL_BY_IDS 後、サービス選択がずれた場合に SetService を再適用する
ForceSetServiceFallback=1

; TSリングバッファのパケット数
; 188 bytes × BufferLength
; 20000 => 約3.76MB
BufferLength=20000

; 1回のTS送信でまとめるパケット数
; 256 => 48128 bytes
SendBufferPackets=256

; 制御パイプ名
; {TUNER} が 0/1/2... に置換されます
PipeName=\\.\pipe\TVTestBridge_{TUNER}

; TS転送パイプ名
; {TUNER} が 0/1/2... に置換されます
TsPipeName=\\.\pipe\TVTestBridgeTS_{TUNER}


; ------------------------------------------------------------
; 個別上書き設定
; 通常は上の PipeName / TsPipeName だけで十分です。
; 特定チューナーだけ別名にしたい場合のみコメント解除してください。
; ------------------------------------------------------------

; [Tuner0]
; PipeName=\\.\pipe\TVTestBridge_0
; TsPipeName=\\.\pipe\TVTestBridgeTS_0

; [Tuner1]
; PipeName=\\.\pipe\TVTestBridge_1
; TsPipeName=\\.\pipe\TVTestBridgeTS_1

; [DID_A]
; PipeName=\\.\pipe\TVTestBridge_0
; TsPipeName=\\.\pipe\TVTestBridgeTS_0

; [DID_B]
; PipeName=\\.\pipe\TVTestBridge_1
; TsPipeName=\\.\pipe\TVTestBridgeTS_1
```
