; TVTestBridgePlugin.ini
; TVTest側のブリッジプラグイン設定です。
;
; TVTestBridge_X の X は、TVTest起動時の /DID から決定します。
; /DID A または /DID 0 => X=0
; /DID B または /DID 1 => X=1
;
; アプリ側のチューナー設定:
;   Tuner0 => \\.\pipe\TVTestBridge_0
;   Tuner1 => \\.\pipe\TVTestBridge_1
; と一致させます。

[Settings]
Enabled=1
VerboseLog=1
AutoEnableTs=0
SendStatusOnConnect=1

; 新方式では PipeName / TsPipeName の X を DID番号に置換します。
; 旧方式の _A / _B suffix は使わない。
UseDidSuffix=0

ForceSetServiceFallback=1

; 10000 ～ 100000
BufferLength=20000
SendBufferPackets=256

; X は /DID から 0 / 1 / 2 ... に置換されます。
PipeName=\\.\pipe\TVTestBridge_X
TsPipeName=\\.\pipe\TVTestBridgeTS_X

; 個別上書きしたい場合だけ使います。
; 通常は [Settings] の TVTestBridge_X だけで十分です。
;
; [Tuner0]
; PipeName=\\.\pipe\TVTestBridge_0
; TsPipeName=\\.\pipe\TVTestBridgeTS_0
;
; [Tuner1]
; PipeName=\\.\pipe\TVTestBridge_1
; TsPipeName=\\.\pipe\TVTestBridgeTS_1